<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه موسیقی QR</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Tahoma, sans-serif;
            color: #333;
        }
        h1 {
            color: #4a4a4a;
            margin-bottom: 20px;
        }
        .cover-image {
            max-width: 90%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        audio {
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    
    <h1>تقدیم به شما</h1>
    
    <img src="photo.jpg" alt="تصویر کاور" class="cover-image">
    
    <audio controls autoplay>
      <source src="song.mp3" type="audio/mpeg">
      مرورگر شما از پخش این فایل صوتی پشتیبانی نمی‌کند.
    </audio>
    
    <p style="margin-top: 20px; font-size: 14px;">لطفاً برای پخش، روی دکمه Play بزنید.</p>
    
</body>
</html>
